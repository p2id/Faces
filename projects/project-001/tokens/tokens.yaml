meta:
  project: project-001
  date: 2026-11-21
  layer: semantic
color:
  surface:
    canvas: "#FFFFFF"
    raised: "#F8FAFC"
    sunken: "#F1F5F9"
    inverse: "#0F172A"
  content:
    primary: "#0F172A"
    secondary: "#475569"
    muted: "#64748B"
    inverse: "#FFFFFF"
    link: "#1D4ED8"
  border:
    default: "#CBD5E1"
    strong: "#94A3B8"
    focus: "#2563EB"
  status:
    info: "#2563EB"
    positive: "#15803D"
    warning: "#A16207"
    negative: "#B91C1C"
typography:
  fontFamily:
    sans: "system-ui, sans-serif"
    mono: "ui-monospace, monospace"
  size:
    xs: "0.75rem"
    sm: "0.875rem"
    md: "1rem"
    lg: "1.125rem"
    xl: "1.5rem"
    display: "2rem"
  lineHeight:
    tight: "1.2"
    normal: "1.5"
    loose: "1.7"
  weight:
    regular: "400"
    medium: "500"
    bold: "700"
spacing:
  "0": "0"
  "1": "0.25rem"
  "2": "0.5rem"
  "3": "0.75rem"
  "4": "1rem"
  "6": "1.5rem"
  "8": "2rem"
  "12": "3rem"
radius:
  sm: "0.25rem"
  md: "0.5rem"
  lg: "0.75rem"
  pill: "999px"
border:
  thin: "1px"
  thick: "2px"
shadow:
  none: "none"
  sm: "0 1px 2px rgb(15 23 42 / 0.08)"
  md: "0 4px 12px rgb(15 23 42 / 0.12)"
opacity:
  disabled: "0.5"
  muted: "0.7"
  overlay: "0.6"
motion:
  duration:
    fast: "120ms"
    normal: "200ms"
    slow: "300ms"
  easing:
    standard: "cubic-bezier(0.2, 0, 0, 1)"
    exit: "cubic-bezier(0.4, 0, 1, 1)"
  reduced: "0ms"
layout:
  contentMax: "75rem"
  readingMax: "75ch"
  gutter: "{spacing.4}"
  sectionGap: "{spacing.8}"
size:
  controlHeight: "2.75rem"
  icon: "1.25rem"
  touchTarget: "2.75rem"
  dialogMax: "35rem"
zIndex:
  base: "0"
  sticky: "10"
  popover: "20"
  drawer: "30"
  modal: "40"
  toast: "50"
state:
  focusRing: "0 0 0 3px rgb(37 99 235 / 0.35)"
  disabledOpacity: "{opacity.disabled}"
  hoverSurface: "{color.surface.sunken}"
  selectedSurface: "#DBEAFE"
  invalidBorder: "{color.status.negative}"
  validBorder: "{color.status.positive}"
  loadingOpacity: "{opacity.muted}"