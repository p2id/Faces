color:
  surface:
    canvas: "#FFFFFF"
    raised: "#F8FAFC"
    inverse: "#0F172A"
  text:
    primary: "#0F172A"
    secondary: "#475569"
    muted: "#64748B"
    inverse: "#FFFFFF"
    link: "#1D4ED8"
  border:
    default: "#CBD5E1"
    subtle: "#E2E8F0"
    strong: "#94A3B8"
    focus: "#2563EB"
  status:
    info: "#2563EB"
    positive: "#15803D"
    warning: "#A16207"
    negative: "#B91C1C"
  action:
    primary: "#1D4ED8"
    primaryHover: "#1E40AF"
    secondary: "#E2E8F0"
typography:
  fontFamily:
    sans: "system-ui, sans-serif"
    mono: "ui-monospace, monospace"
  size:
    xs: "0.75rem"
    sm: "0.875rem"
    md: "1rem"
    lg: "1.125rem"
    xl: "1.5rem"
    display: "2.25rem"
  lineHeight:
    tight: "1.2"
    normal: "1.5"
    relaxed: "1.7"
  weight:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700
spacing:
  "0": "0"
  "1": "0.25rem"
  "2": "0.5rem"
  "3": "0.75rem"
  "4": "1rem"
  "6": "1.5rem"
  "8": "2rem"
  "12": "3rem"
radius:
  none: "0"
  sm: "0.25rem"
  md: "0.5rem"
  lg: "0.75rem"
  pill: "999px"
border:
  thin: "1px"
  thick: "2px"
shadow:
  none: "none"
  sm: "0 1px 2px rgb(15 23 42 / 0.08)"
  md: "0 4px 12px rgb(15 23 42 / 0.12)"
opacity:
  disabled: 0.5
  muted: 0.7
  overlay: 0.6
motion:
  duration:
    instant: "0ms"
    fast: "120ms"
    normal: "200ms"
    slow: "320ms"
  easing:
    standard: "cubic-bezier(0.2, 0, 0, 1)"
layout:
  containerMax: "1200px"
  contentMax: "720px"
  gutter: "{spacing.4}"
  sectionGap: "{spacing.8}"
size:
  controlHeight: "44px"
  iconSm: "16px"
  iconMd: "20px"
  iconLg: "24px"
zIndex:
  base: 0
  sticky: 10
  popover: 20
  modal: 30
  toast: 40
state:
  focusRing: "0 0 0 3px rgb(37 99 235 / 0.35)"
  disabledOpacity: "{opacity.disabled}"
  hoverSurface: "{color.surface.raised}"
  selectedSurface: "#DBEAFE"
  errorBorder: "{color.status.negative}"
  successBorder: "{color.status.positive}"