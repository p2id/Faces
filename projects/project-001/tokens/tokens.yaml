meta:
  date: "2026-11-15"
  project: "project-001"
  layer: semantic
color:
  surface:
    default: "#FFFFFF"
    subtle: "#F7F8FA"
    raised: "#FFFFFF"
    inverse: "#17202A"
    disabled: "#EEF0F2"
  content:
    primary: "#17202A"
    secondary: "#52606D"
    muted: "#7B8794"
    inverse: "#FFFFFF"
    disabled: "#9AA5B1"
    link: "#155EEF"
  border:
    default: "#D9E2EC"
    strong: "#9AA5B1"
    focus: "#155EEF"
    error: "#D92D20"
  accent:
    default: "#155EEF"
    hover: "#0E4CB5"
    active: "#0B3B8C"
    subtle: "#EAF2FF"
  state:
    info: "#155EEF"
    success: "#18864B"
    caution: "#B54708"
    error: "#D92D20"
typography:
  fontFamily:
    sans: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
    mono: "ui-monospace, SFMono-Regular, Menlo, monospace"
  fontSize:
    xs: "0.75rem"
    sm: "0.875rem"
    md: "1rem"
    lg: "1.25rem"
    xl: "1.5rem"
    display: "2rem"
  fontWeight:
    regular: "400"
    medium: "500"
    semibold: "600"
    bold: "700"
  lineHeight:
    tight: "1.2"
    normal: "1.5"
    loose: "1.7"
spacing:
  "0": "0"
  "1": "0.25rem"
  "2": "0.5rem"
  "3": "0.75rem"
  "4": "1rem"
  "6": "1.5rem"
  "8": "2rem"
  "12": "3rem"
  "16": "4rem"
radius:
  sm: "0.25rem"
  md: "0.5rem"
  lg: "0.75rem"
  pill: "999px"
border:
  thin: "1px"
  thick: "2px"
shadow:
  none: "none"
  sm: "0 1px 2px rgb(23 32 42 / 0.08)"
  md: "0 4px 12px rgb(23 32 42 / 0.12)"
  lg: "0 12px 32px rgb(23 32 42 / 0.16)"
opacity:
  disabled: "0.5"
  muted: "0.7"
  overlay: "0.6"
motion:
  duration:
    fast: "100ms"
    normal: "200ms"
    slow: "300ms"
  easing:
    standard: "cubic-bezier(0.2, 0, 0, 1)"
    emphasized: "cubic-bezier(0.2, 0, 0, 1)"
  reduced: "0ms"
layout:
  contentMax: "80rem"
  gutterXs: "{spacing.4}"
  gutterMd: "{spacing.6}"
  gutterLg: "{spacing.8}"
  gridGap: "{spacing.4}"
  railWidth: "15rem"
size:
  targetMin: "44px"
  controlHeight: "40px"
  controlHeightCompact: "32px"
  iconSm: "16px"
  iconMd: "20px"
  iconLg: "24px"
zIndex:
  base: "0"
  sticky: "10"
  dropdown: "20"
  overlay: "30"
  toast: "40"
state:
  focusRing: "0 0 0 {border.thick} {color.border.focus}"
  disabledOpacity: "{opacity.disabled}"
  selectedSurface: "{color.accent.subtle}"
  errorSurface: "#FEF3F2"
  successSurface: "#ECFDF3"
  cautionSurface: "#FFFAEB"
  infoSurface: "#EFF8FF"