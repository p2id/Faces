color:
  surface:
    canvas: "#FFFFFF"
    raised: "#F8FAFC"
    sunken: "#F1F5F9"
    inverse: "#0F172A"
  text:
    primary: "#0F172A"
    secondary: "#475569"
    muted: "#64748B"
    inverse: "#FFFFFF"
    on-accent: "#FFFFFF"
  border:
    default: "#CBD5E1"
    subtle: "#E2E8F0"
    strong: "#94A3B8"
  accent:
    default: "#2563EB"
    hover: "#1D4ED8"
    pressed: "#1E40AF"
    subtle: "#DBEAFE"
  status:
    positive: "#15803D"
    positive-subtle: "#DCFCE7"
    caution: "#A16207"
    caution-subtle: "#FEF3C7"
    negative: "#B91C1C"
    negative-subtle: "#FEE2E2"
    informative: "#0369A1"
    informative-subtle: "#E0F2FE"
typography:
  family:
    sans: "system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif"
    mono: "ui-monospace, SFMono-Regular, Menlo, monospace"
  size:
    xs: "0.75rem"
    sm: "0.875rem"
    md: "1rem"
    lg: "1.125rem"
    xl: "1.5rem"
    2xl: "2rem"
  weight:
    regular: "400"
    medium: "500"
    semibold: "600"
    bold: "700"
  line:
    tight: "1.2"
    normal: "1.5"
    relaxed: "1.7"
spacing:
  "0": "0"
  "1": "0.25rem"
  "2": "0.5rem"
  "3": "0.75rem"
  "4": "1rem"
  "6": "1.5rem"
  "8": "2rem"
  "12": "3rem"
  "16": "4rem"
radius:
  none: "0"
  sm: "0.25rem"
  md: "0.5rem"
  lg: "0.75rem"
  pill: "999px"
border:
  thin: "1px"
  thick: "2px"
shadow:
  none: "none"
  sm: "0 1px 2px rgba(15,23,42,0.08)"
  md: "0 4px 12px rgba(15,23,42,0.12)"
  lg: "0 12px 32px rgba(15,23,42,0.16)"
opacity:
  disabled: "0.5"
  muted: "0.7"
  overlay: "0.6"
motion:
  fast: "120ms"
  normal: "200ms"
  slow: "320ms"
  ease: "cubic-bezier(0.2,0,0,1)"
  reduced: "0ms"
layout:
  content-max: "1200px"
  reading-max: "720px"
  gutter-xs: "{spacing.4}"
  gutter-md: "{spacing.6}"
  gutter-lg: "{spacing.8}"
size:
  control-sm: "32px"
  control-md: "40px"
  control-lg: "48px"
  touch-min: "44px"
  icon-sm: "16px"
  icon-md: "20px"
  icon-lg: "24px"
z-index:
  base: "0"
  sticky: "10"
  dropdown: "100"
  overlay: "200"
  modal: "300"
  toast: "400"
state:
  focus-ring: "0 0 0 3px {color.accent.subtle}"
  disabled-opacity: "{opacity.disabled}"
  selected-surface: "{color.accent.subtle}"
  error-border: "{color.status.negative}"
  success-border: "{color.status.positive}"
  interactive-transition: "color {motion.normal} {motion.ease}, background-color {motion.normal} {motion.ease}, border-color {motion.normal} {motion.ease}, box-shadow {motion.normal} {motion.ease}"