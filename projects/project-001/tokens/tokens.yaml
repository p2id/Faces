color:
  surface:
    default: "#FFFFFF"
    subtle: "#F7F8FA"
    raised: "#FFFFFF"
    inverse: "#1F2937"
  content:
    default: "#17202A"
    muted: "#5B6673"
    subtle: "#7A8591"
    inverse: "#FFFFFF"
    disabled: "#9AA3AD"
  border:
    default: "#D6DCE3"
    strong: "#AAB4C0"
    focus: "#2563EB"
    error: "#C62828"
  action:
    primary: "#2563EB"
    primaryHover: "#1D4ED8"
    primaryPressed: "#1E40AF"
    secondary: "#E8EEF8"
    quiet: "transparent"
    disabled: "#E5E7EB"
  status:
    info: "#2563EB"
    success: "#18794E"
    caution: "#A15C00"
    error: "#C62828"
    neutral: "#5B6673"
  state:
    hover: "#F1F5F9"
    selected: "#E8EEF8"
    disabled: "#F3F4F6"
    overlay: "rgba(15, 23, 42, 0.48)"
typography:
  fontFamily:
    sans: "system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif"
    mono: "ui-monospace, SFMono-Regular, Menlo, monospace"
  size:
    xs: "0.75rem"
    sm: "0.875rem"
    md: "1rem"
    lg: "1.125rem"
    xl: "1.5rem"
    xxl: "2rem"
  lineHeight:
    tight: "1.2"
    normal: "1.5"
    relaxed: "1.7"
  weight:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700
spacing:
  "0": "0"
  "1": "0.25rem"
  "2": "0.5rem"
  "3": "0.75rem"
  "4": "1rem"
  "5": "1.25rem"
  "6": "1.5rem"
  "8": "2rem"
  "10": "2.5rem"
  "12": "3rem"
  "16": "4rem"
radius:
  none: "0"
  sm: "0.25rem"
  md: "0.5rem"
  lg: "0.75rem"
  pill: "999px"
border:
  width:
    none: "0"
    thin: "1px"
    thick: "2px"
  style: solid
shadow:
  none: "none"
  sm: "0 1px 2px rgba(15, 23, 42, 0.08)"
  md: "0 4px 12px rgba(15, 23, 42, 0.12)"
  lg: "0 12px 32px rgba(15, 23, 42, 0.16)"
opacity:
  disabled: 0.55
  muted: 0.72
  overlay: 0.48
motion:
  duration:
    fast: "100ms"
    normal: "180ms"
    slow: "280ms"
  easing:
    standard: "cubic-bezier(0.2, 0, 0, 1)"
    emphasis: "cubic-bezier(0.2, 0, 0, 1)"
  reduced: "0ms"
layout:
  contentMax: "80rem"
  gutterXs: "{spacing.4}"
  gutterMd: "{spacing.6}"
  gutterLg: "{spacing.8}"
  detailMin: "20rem"
  gridGap: "{spacing.4}"
size:
  controlHeight: "2.75rem"
  iconSm: "1rem"
  iconMd: "1.25rem"
  iconLg: "1.5rem"
  touchTarget: "2.75rem"
  headerHeight: "4rem"
zIndex:
  base: 0
  sticky: 10
  dropdown: 20
  toast: 30
  modal: 40
  tooltip: 50
state:
  focusRing: "0 0 0 3px rgba(37, 99, 235, 0.32)"
  disabledOpacity: "{opacity.disabled}"
  selectedSurface: "{color.state.selected}"
  hoverSurface: "{color.state.hover}"
  errorBorder: "{color.border.error}"
  loadingOpacity: "{opacity.muted}"