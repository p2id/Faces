meta:
  project: project-001
  date: 2026-11-25
  layer: semantic
color:
  background:
    canvas: "#FFFFFF"
    surface: "#F8FAFC"
    raised: "#FFFFFF"
    inverse: "#0F172A"
  text:
    primary: "#0F172A"
    secondary: "#475569"
    muted: "#64748B"
    inverse: "#FFFFFF"
    link: "#1D4ED8"
  border:
    default: "#CBD5E1"
    subtle: "#E2E8F0"
    strong: "#94A3B8"
    focus: "#2563EB"
  accent:
    default: "#2563EB"
    hover: "#1D4ED8"
    pressed: "#1E40AF"
    subtle: "#EFF6FF"
  state:
    positive: "#15803D"
    positive-subtle: "#F0FDF4"
    warning: "#A16207"
    warning-subtle: "#FEFCE8"
    negative: "#B91C1C"
    negative-subtle: "#FEF2F2"
    informative: "#0369A1"
    informative-subtle: "#F0F9FF"
    disabled: "#94A3B8"
typography:
  family:
    sans: "system-ui, -apple-system, sans-serif"
    mono: "ui-monospace, SFMono-Regular, monospace"
  size:
    xs: "0.75rem"
    sm: "0.875rem"
    md: "1rem"
    lg: "1.125rem"
    xl: "1.5rem"
    display: "2rem"
  line:
    tight: "1.2"
    normal: "1.5"
    relaxed: "1.7"
  weight:
    regular: "400"
    medium: "500"
    semibold: "600"
    bold: "700"
spacing:
  "0": "0"
  "1": "0.25rem"
  "2": "0.5rem"
  "3": "0.75rem"
  "4": "1rem"
  "6": "1.5rem"
  "8": "2rem"
  "12": "3rem"
radius:
  none: "0"
  sm: "0.25rem"
  md: "0.5rem"
  lg: "0.75rem"
  pill: "999px"
border:
  thin: "1px"
  thick: "2px"
shadow:
  none: "none"
  sm: "0 1px 2px rgb(15 23 42 / 0.08)"
  md: "0 4px 12px rgb(15 23 42 / 0.12)"
  lg: "0 12px 32px rgb(15 23 42 / 0.16)"
opacity:
  disabled: "0.5"
  muted: "0.7"
  overlay: "0.6"
motion:
  duration:
    fast: "120ms"
    normal: "180ms"
    slow: "240ms"
  easing:
    standard: "cubic-bezier(0.2, 0, 0, 1)"
    exit: "cubic-bezier(0.4, 0, 1, 1)"
  reduced: "0ms"
layout:
  content-max: "80rem"
  reading-max: "42rem"
  grid-gap: "{spacing.6}"
  page-padding: "{spacing.4}"
size:
  control-sm: "2rem"
  control-md: "2.75rem"
  control-lg: "3.25rem"
  icon-sm: "1rem"
  icon-md: "1.25rem"
  icon-lg: "1.5rem"
z-index:
  base: "0"
  sticky: "10"
  dropdown: "20"
  overlay: "30"
  dialog: "40"
  toast: "50"
state:
  focus-ring: "0 0 0 3px {color.accent.subtle}, 0 0 0 5px {color.border.focus}"
  disabled-opacity: "{opacity.disabled}"
  busy-opacity: "{opacity.muted}"
  selected-background: "{color.accent.subtle}"
  error-border: "{color.state.negative}"
  success-border: "{color.state.positive}"