color:
  brand:
    primary: "#2457A6"
    onPrimary: "#FFFFFF"
  surface:
    canvas: "#FFFFFF"
    subtle: "#F5F7FA"
    raised: "#FFFFFF"
    inverse: "#17202A"
  text:
    primary: "#17202A"
    secondary: "#52606D"
    muted: "#6B7785"
    inverse: "#FFFFFF"
    link: "{color.brand.primary}"
  border:
    default: "#CBD2D9"
    strong: "#9AA5B1"
    subtle: "#E4E7EB"
    focus: "{color.brand.primary}"
  status:
    success: "#16794C"
    warning: "#9A6700"
    error: "#B42318"
    info: "{color.brand.primary}"
typography:
  fontFamily:
    sans: "system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif"
    mono: "ui-monospace, SFMono-Regular, Consolas, monospace"
  size:
    xs: "0.75rem"
    sm: "0.875rem"
    md: "1rem"
    lg: "1.125rem"
    xl: "1.5rem"
    xxl: "2rem"
  weight:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700
  lineHeight:
    tight: 1.2
    normal: 1.5
    loose: 1.7
spacing:
  "0": "0"
  "1": "0.25rem"
  "2": "0.5rem"
  "3": "0.75rem"
  "4": "1rem"
  "5": "1.25rem"
  "6": "1.5rem"
  "8": "2rem"
  "10": "2.5rem"
  "12": "3rem"
radius:
  none: "0"
  sm: "0.25rem"
  md: "0.5rem"
  lg: "0.75rem"
  pill: "999px"
border:
  thin: "1px"
  thick: "2px"
  focus: "2px"
shadow:
  none: "none"
  sm: "0 1px 2px rgb(23 32 42 / 0.08)"
  md: "0 4px 12px rgb(23 32 42 / 0.12)"
  lg: "0 12px 32px rgb(23 32 42 / 0.16)"
opacity:
  disabled: 0.5
  muted: 0.72
  overlay: 0.6
motion:
  duration:
    fast: "120ms"
    normal: "200ms"
    slow: "320ms"
  easing:
    standard: "cubic-bezier(0.2, 0, 0, 1)"
    emphasis: "cubic-bezier(0.2, 0.8, 0.2, 1)"
  reduced: "0ms"
layout:
  contentMax: "75rem"
  sidebarWidth: "16rem"
  gutter: "{spacing.6}"
  stackGap: "{spacing.6}"
  gridGap: "{spacing.4}"
size:
  controlHeight: "2.75rem"
  iconSm: "1rem"
  iconMd: "1.25rem"
  iconLg: "1.5rem"
  targetMin: "2.75rem"
  modalMax: "32rem"
zIndex:
  base: 0
  sticky: 10
  dropdown: 20
  overlay: 30
  modal: 40
  toast: 50
state:
  hoverOverlay: "rgb(23 32 42 / 0.06)"
  pressedOverlay: "rgb(23 32 42 / 0.12)"
  focusRing: "0 0 0 3px rgb(36 87 166 / 0.28)"
  disabledText: "{color.text.muted}"
  disabledSurface: "{color.surface.subtle}"
  selectedSurface: "#E8F0FC"
  errorSurface: "#FDECEC"
  successSurface: "#EAF7F0"
  warningSurface: "#FFF7E5"