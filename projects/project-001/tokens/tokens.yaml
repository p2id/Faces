color:
  surface:
    default: "#FFFFFF"
    subtle: "#F6F7F9"
    raised: "#FFFFFF"
    inverse: "#17202A"
  text:
    primary: "#17202A"
    secondary: "#536273"
    muted: "#718096"
    inverse: "#FFFFFF"
    disabled: "#A0AEC0"
  border:
    default: "#D9E0E7"
    strong: "#AAB7C4"
    focus: "#2563EB"
    danger: "#C53030"
  accent:
    default: "#2563EB"
    hover: "#1D4ED8"
    pressed: "#1E40AF"
  status:
    info: "#2563EB"
    success: "#16803C"
    warning: "#A15C00"
    danger: "#C53030"
typography:
  fontFamily:
    sans: "system-ui, sans-serif"
    mono: "ui-monospace, monospace"
  size:
    xs: "0.75rem"
    sm: "0.875rem"
    md: "1rem"
    lg: "1.25rem"
    xl: "1.5rem"
    display: "2rem"
  weight:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700
  lineHeight:
    tight: 1.2
    normal: 1.5
    relaxed: 1.7
spacing:
  "0": "0"
  "1": "0.25rem"
  "2": "0.5rem"
  "3": "0.75rem"
  "4": "1rem"
  "5": "1.25rem"
  "6": "1.5rem"
  "8": "2rem"
  "10": "2.5rem"
  "12": "3rem"
radius:
  none: "0"
  sm: "0.25rem"
  md: "0.5rem"
  lg: "0.75rem"
  pill: "999px"
border:
  thin: "1px"
  medium: "2px"
shadow:
  none: "none"
  sm: "0 1px 2px rgba(23,32,42,0.08)"
  md: "0 4px 12px rgba(23,32,42,0.12)"
  lg: "0 12px 32px rgba(23,32,42,0.16)"
opacity:
  disabled: 0.5
  muted: 0.7
  overlay: 0.6
motion:
  duration:
    fast: "100ms"
    normal: "200ms"
    slow: "300ms"
  easing:
    standard: "cubic-bezier(0.2,0,0,1)"
    emphasis: "cubic-bezier(0.2,0,0,1)"
  reduced: "0ms"
layout:
  contentMax: "70rem"
  wideMax: "80rem"
  pagePadding: "{spacing.4}"
  gridGap: "{spacing.4}"
size:
  targetMin: "44px"
  controlHeight: "40px"
  headerHeight: "64px"
  iconSm: "16px"
  iconMd: "20px"
  iconLg: "24px"
zIndex:
  base: 0
  sticky: 10
  dropdown: 20
  overlay: 30
  toast: 40
state:
  focusRing: "0 0 0 3px rgba(37,99,235,0.35)"
  disabledOpacity: "{opacity.disabled}"
  hoverSurface: "{color.surface.subtle}"
  selectedSurface: "#E8F0FE"
  errorSurface: "#FFF5F5"
  successSurface: "#F0FFF4"