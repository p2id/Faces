color:
  surface:
    canvas: "#FFFFFF"
    raised: "#F8FAFC"
    inverse: "#0F172A"
    selected: "#EFF6FF"
  content:
    primary: "#0F172A"
    secondary: "#475569"
    muted: "#64748B"
    inverse: "#FFFFFF"
    link: "#1D4ED8"
  border:
    default: "#CBD5E1"
    strong: "#94A3B8"
    focus: "#2563EB"
  status:
    info: "#2563EB"
    success: "#15803D"
    warning: "#A16207"
    error: "#B91C1C"
  action:
    primary: "#1D4ED8"
    primaryHover: "#1E40AF"
    danger: "#B91C1C"
typography:
  family:
    sans: "Inter, system-ui, sans-serif"
    mono: "ui-monospace, SFMono-Regular, monospace"
  size:
    xs: "0.75rem"
    sm: "0.875rem"
    md: "1rem"
    lg: "1.125rem"
    xl: "1.5rem"
    display: "2rem"
  weight:
    regular: "400"
    medium: "500"
    semibold: "600"
    bold: "700"
  lineHeight:
    tight: "1.2"
    normal: "1.5"
    relaxed: "1.7"
spacing:
  "0": "0"
  "1": "0.25rem"
  "2": "0.5rem"
  "3": "0.75rem"
  "4": "1rem"
  "6": "1.5rem"
  "8": "2rem"
  "12": "3rem"
radius:
  none: "0"
  sm: "0.25rem"
  md: "0.5rem"
  lg: "0.75rem"
  pill: "999px"
border:
  thin: "1px"
  thick: "2px"
shadow:
  none: "none"
  sm: "0 1px 2px rgba(15,23,42,0.08)"
  md: "0 4px 12px rgba(15,23,42,0.12)"
  lg: "0 12px 32px rgba(15,23,42,0.16)"
opacity:
  disabled: "0.5"
  muted: "0.7"
  overlay: "0.6"
motion:
  duration:
    fast: "120ms"
    standard: "200ms"
    slow: "300ms"
  easing:
    standard: "cubic-bezier(0.2,0,0,1)"
    exit: "cubic-bezier(0.4,1,1,1)"
  reduced: "0ms"
layout:
  contentMax: "90rem"
  readingMax: "45rem"
  pageGutter: "{spacing.4}"
  gridGap: "{spacing.4}"
  navWidth: "15rem"
size:
  controlHeight: "2.75rem"
  icon: "1.25rem"
  touchTarget: "2.75rem"
  rowMinHeight: "3.5rem"
zIndex:
  base: "0"
  sticky: "10"
  dropdown: "100"
  overlay: "200"
  toast: "300"
  tooltip: "400"
state:
  focusRing: "0 0 0 3px rgba(37,99,235,0.32)"
  disabledOpacity: "{opacity.disabled}"
  hoverSurface: "{color.surface.raised}"
  selectedSurface: "{color.surface.selected}"
  invalidBorder: "{color.status.error}"
  successBorder: "{color.status.success}"
  loadingOpacity: "{opacity.muted}"