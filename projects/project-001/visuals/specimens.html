<section aria-labelledby="specimen-title">
<h1 id="specimen-title">Generic product experience specimens</h1>
<form>
<label for="field">Required input</label>
<input id="field" name="field" placeholder="Enter a value" aria-describedby="hint error">
<p id="hint">Use a concise, meaningful value.</p>
<p id="error" role="alert" hidden>Check this value and try again.</p>
<button type="submit">Continue</button>
<button type="button">Cancel</button>
</form>
<aside role="status" aria-live="polite">Status appears here without color alone.</aside>
</section>
<!-- Rules: semantic structure; explicit labels; one primary action; no placeholder-only instructions; all states documented. -->
