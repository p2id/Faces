<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generic product experience specimens</title>
<style>
:root{--canvas:#f7f9fa;--surface:#fff;--ink:#263238;--muted:#607d8b;--accent:#2f6f8f}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:960px;margin:auto;padding:24px}header,section{background:var(--surface);border-radius:12px;padding:24px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{border:1px solid #cfd8dc;border-radius:4px;padding:16px}
button{min-height:44px;border:0;border-radius:4px;padding:0 16px;background:var(--accent);color:#fff;font-weight:600}
input{min-height:44px;width:100%;border:1px solid var(--muted);border-radius:4px;padding:8px}
.muted{color:var(--muted)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:767px){main{padding:12px}.grid{grid-template-columns:1fr}header,section{padding:16px}}
</style>
</head>
<body>
<main>
<header><h1>Overview</h1><p class="muted">Review status and continue to detail.</p><button type="button">Open detail</button></header>
<section class="grid">
<article class="card"><h2>Detail</h2><p>Structured information remains readable at every width.</p></article>
<article class="card"><h2>Input</h2><label for="value">Value</label><input id="value" placeholder="Enter a value"></article>
</section>
<section aria-live="polite"><h2>Feedback</h2><p>Completion, empty, loading, and error messages use a consistent region.</p></section>
</main>
</body>
</html>
