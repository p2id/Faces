<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neutral interface specimens</title>
<style>
:root{--bg:#f7f8fa;--surface:#fff;--text:#17202a;--muted:#667085;--line:#d9dee7;--accent:#2f6fed;--space:8px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
main{max-width:960px;margin:auto;padding:32px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;margin:16px 0}
label{display:block;font-weight:600;margin-bottom:6px}input,select,button{font:inherit;min-height:44px;border-radius:6px;border:1px solid var(--line);padding:8px 12px}input,select{width:100%;margin-bottom:16px}button{background:var(--accent);color:#fff;border:0;font-weight:600}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9cc0ff;outline-offset:2px}.status{color:var(--muted);padding:12px 0}
</style>
</head>
<body><main>
<h1>Product interface specimen</h1>
<section class="panel" aria-labelledby="form-title"><h2 id="form-title">Input and confirmation</h2><label for="value">Value</label><input id="value" name="value" placeholder="Enter a value"><label for="mode">Mode</label><select id="mode" name="mode"><option>Default</option><option>Alternative</option></select><button type="button">Continue</button><p class="status" role="status">Status appears here without displacing the primary action.</p></section>
</main></body>
</html>
