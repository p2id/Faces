Rationale: Low-fidelity structure exposes hierarchy, grouping, navigation, and priority without brand-specific assumptions.
Quality gates: valid SVG; labelled regions; logical reading order; no decorative dependency; legible from 320 to 1440 px.
Repository intent: /projects/project-001/sections/E/wireframes.svg is the canonical structural reference.
Writing and publishing: use short neutral labels; publish only after hierarchy, accessibility, spacing, and breakpoint checks pass.