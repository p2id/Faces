Rationale: low-fidelity geometry documents hierarchy, navigation, content grouping, primary action, and feedback regions without product-specific styling.
Gate coverage: semantic order, focus order, contrast, target size, empty/loading/error placement, and responsive reflow.
Path intent: repository/e/wireframes/product-shell.svg; retain editable source beside any rendered preview.
Writing rule: labels must be concise, neutral, action-oriented, and free of implied affiliation.
Publishing rule: validate SVG structure, inspect at 100% and 200%, and publish only after gate completion.