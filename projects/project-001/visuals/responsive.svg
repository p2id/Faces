<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Responsive layout bands">
<title>Responsive layout bands</title>
<g font-family="Arial,sans-serif" fill="#172033"><text x="32" y="32" font-size="18" font-weight="700">Responsive bands</text><text x="32" y="82" font-size="15">Compact</text><text x="32" y="178" font-size="15">Medium</text><text x="32" y="274" font-size="15">Wide</text></g>
<g stroke="#cbd3df" fill="#f7f8fa"><rect x="128" y="48" width="300" height="64" rx="8"/><rect x="128" y="144" width="520" height="64" rx="8"/><rect x="128" y="240" width="760" height="64" rx="8"/></g>
<g font-family="Arial,sans-serif" font-size="14" fill="#26344a"><text x="152" y="76">One column; collapsed navigation; stacked actions</text><text x="152" y="172">Flexible content; compact navigation; two-column cards</text><text x="152" y="268">Persistent navigation; bounded content; expanded cards</text><text x="152" y="292">44px minimum targets; no horizontal scroll; readable line length</text></g>
</svg>
Rationale: content-driven bands preserve task order while allowing reflow instead of desktop scaling.
Coverage: compact, medium, wide, zoom, long labels, keyboard navigation, touch targets, and overflow.
Quality gate: no clipping, overlap, required horizontal scroll, or broken focus order at 200% zoom.
Repository path intent: /projects/project-001/design/sections/h/responsive.svg.