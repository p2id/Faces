<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="Responsive layout model">
<title>Responsive layout model</title>
<rect width="1200" height="470" fill="#f7f8fa"/>
<g font-family="sans-serif" fill="#17202a">
<text x="40" y="42" font-size="24" font-weight="700">Responsive layout bands</text>
<g fill="#fff" stroke="#cfd6df"><rect x="40" y="80" width="330" height="300" rx="8"/><rect x="435" y="80" width="330" height="300" rx="8"/><rect x="830" y="80" width="330" height="300" rx="8"/></g>
<text x="64" y="116" font-size="18" font-weight="700">Compact</text><text x="64" y="146">0–599 px</text><text x="64" y="190">Single column</text><text x="64" y="220">Collapsed navigation</text><text x="64" y="250">Stacked actions</text><text x="64" y="280">Targets ≥44 px</text>
<text x="459" y="116" font-size="18" font-weight="700">Standard</text><text x="459" y="146">600–959 px</text><text x="459" y="190">Flexible two-column</text><text x="459" y="220">Condensed navigation</text><text x="459" y="250">Wrapped content</text><text x="459" y="280">Stable reading width</text>
<text x="854" y="116" font-size="18" font-weight="700">Wide</text><text x="854" y="146">960 px+</text><text x="854" y="190">Side navigation</text><text x="854" y="220">Multi-column cards</text><text x="854" y="250">Maximum content width</text><text x="854" y="280">Persistent context</text>
</g></svg>
Rationale: content priority determines adaptation while preserving access to controls.
Quality gates: test band boundaries and zoom; preserve reading order; prevent clipping and horizontal scrolling; support keyboard, touch, and reduced motion.