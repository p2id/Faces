<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-label="Responsive layout rules">
<title>Responsive Layout Rules</title>
<rect width="960" height="370" fill="#f7f8fa"/>
<g font-family="Arial,sans-serif" fill="#293241">
<rect x="32" y="24" width="280" height="320" rx="8" fill="#fff" stroke="#c8ced8"/>
<rect x="340" y="24" width="280" height="320" rx="8" fill="#fff" stroke="#c8ced8"/>
<rect x="648" y="24" width="280" height="320" rx="8" fill="#fff" stroke="#c8ced8"/>
<text x="56" y="60" font-size="20">Compact</text><text x="364" y="60" font-size="20">Medium</text><text x="672" y="60" font-size="20">Wide</text>
<text x="56" y="94" font-size="14">320–599px</text><text x="364" y="94" font-size="14">600–959px</text><text x="672" y="94" font-size="14">960px+</text>
<text x="56" y="140" font-size="14">One column</text><text x="364" y="140" font-size="14">Flexible columns</text><text x="672" y="140" font-size="14">Navigation plus content</text>
<text x="56" y="174" font-size="14">Collapsed navigation</text><text x="364" y="174" font-size="14">Condensed navigation</text><text x="672" y="174" font-size="14">Persistent navigation</text>
<text x="56" y="208" font-size="14">24px page padding</text><text x="364" y="208" font-size="14">32px page padding</text><text x="672" y="208" font-size="14">40px page padding</text>
<text x="56" y="242" font-size="14">Stack actions</text><text x="364" y="242" font-size="14">Wrap actions</text><text x="672" y="242" font-size="14">Inline actions</text>
<text x="56" y="288" font-size="13">No horizontal scroll</text><text x="364" y="288" font-size="13">Readable line length</text><text x="672" y="288" font-size="13">Max width 1280px</text>
</g></svg>