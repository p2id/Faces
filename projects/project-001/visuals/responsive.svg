<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Responsive layout rules">
<title>Responsive Layout Rules</title>
<style>text{font:14px system-ui;fill:#17202a}.b{fill:#fff;stroke:#9aa7b2;stroke-width:2}.x{fill:#dceeff}.n{fill:#eef2f5}</style>
<rect width="960" height="420" fill="#f7f9fa"/><text x="24" y="34" font-size="20" font-weight="bold">Responsive composition</text>
<g transform="translate(24 60)">
<rect class="b" width="270" height="300" rx="10"/><text x="20" y="32" font-weight="bold">Small · 320–599</text><rect class="x" x="20" y="56" width="230" height="34" rx="5"/><rect class="n" x="20" y="106" width="230" height="100" rx="5"/><rect class="x" x="20" y="222" width="230" height="38" rx="5"/><text x="20" y="282">Single column; stacked actions</text>
<rect class="b" x="310" width="270" height="300" rx="10"/><text x="330" y="32" font-weight="bold">Medium · 600–1023</text><rect class="x" x="330" y="56" width="230" height="34" rx="5"/><rect class="n" x="330" y="106" width="150" height="100" rx="5"/><rect class="n" x="490" y="106" width="70" height="100" rx="5"/><rect class="x" x="330" y="222" width="150" height="38" rx="5"/><text x="330" y="282">Flexible grid; compact panel</text>
<rect class="b" x="620" width="294" height="300" rx="10"/><text x="640" y="32" font-weight="bold">Large · 1024+</text><rect class="x" x="640" y="56" width="254" height="34" rx="5"/><rect class="n" x="640" y="106" width="168" height="100" rx="5"/><rect class="n" x="820" y="106" width="74" height="100" rx="5"/><rect class="x" x="640" y="222" width="130" height="38" rx="5"/><text x="640" y="282">Two-column; bounded width</text>
</g></svg>