Rationale: the representation shows structural reflow rather than scaled screenshots; navigation collapses, content stacks, and actions remain reachable.
Quality gates: no horizontal scrolling, preserved reading order, 44×44px minimum targets, 320px reflow, 200% zoom usability, and orientation support.
