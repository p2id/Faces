<title>project-001 responsive layouts</title>
<g fill="none" stroke="#243447" stroke-width="2"><rect x="20" y="25" width="180" height="240" rx="10" fill="#f7f9fb"/><rect x="240" y="25" width="280" height="240" rx="10" fill="#f7f9fb"/><rect x="560" y="25" width="320" height="240" rx="10" fill="#f7f9fb"/><path d="M42 70h136M42 96h136M42 122h136M262 70h236M262 96h236M262 122h236M582 70h276M582 96h276M582 122h276"/><rect x="42" y="150" width="136" height="70" rx="6"/><rect x="262" y="150" width="108" height="70" rx="6"/><rect x="390" y="150" width="108" height="70" rx="6"/><rect x="582" y="150" width="126" height="70" rx="6"/><rect x="732" y="150" width="126" height="70" rx="6"/></g>
<g font-family="sans-serif" font-size="14" fill="#243447" text-anchor="middle"><text x="110" y="51">Compact</text><text x="380" y="51">Medium</text><text x="720" y="51">Wide</text></g>
