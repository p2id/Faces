<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Responsive layout rules">
<g fill="none" stroke="#334155" stroke-width="2"><rect x="24" y="28" width="180" height="340" rx="8"/><rect x="230" y="28" width="300" height="340" rx="8"/><rect x="556" y="28" width="380" height="340" rx="8"/><path d="M48 82h132M48 112h92M48 160h132M48 190h108M48 238h132M48 268h82"/><path d="M254 82h252M254 118h220M254 166h252M254 206h252M254 246h118M390 246h116M254 294h252"/><path d="M580 82h332M580 126h332M580 178h156M752 178h160M580 226h332M580 274h160M752 274h160M580 322h332"/></g>
<g fill="#334155" font-family="sans-serif" font-size="15"><text x="48" y="56">Compact · 320–599</text><text x="254" y="56">Medium · 600–1023</text><text x="580" y="56">Wide · 1024+</text><text x="24" y="402">Rules: stack regions; collapse secondary navigation; preserve the primary action; use fluid type and spacing; avoid horizontal scroll.</text></g></svg>
Rationale: The representation communicates layout priority rather than device-specific decoration.
Quality gates: check 320, 768, and 1440 px; support keyboard navigation and 200% zoom; preserve reflow; use touch targets of at least 44 px.
Repository intent: /projects/project-001/sections/F/responsive.svg defines breakpoint behavior for implementation-neutral review.
Writing and publishing: describe behavior rather than framework classes; publish with compact, medium, and wide checks.