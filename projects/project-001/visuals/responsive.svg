<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
<title id="title">Responsive layout rules</title>
<desc id="desc">Wide, medium, and compact arrangements preserve hierarchy and context.</desc>
<g fill="#FFF" stroke="#263238" stroke-width="2">
<rect x="24" y="44" width="280" height="300" rx="12"/>
<rect x="340" y="44" width="280" height="300" rx="12"/>
<rect x="656" y="44" width="280" height="300" rx="12"/>
</g>
<g font-family="sans-serif" fill="#263238">
<text x="42" y="78" font-size="18">Wide ≥1200</text>
<text x="358" y="78" font-size="18">Medium 768–1199</text>
<text x="674" y="78" font-size="18">Compact &lt;768</text>
<g font-size="14">
<text x="42" y="116">Two content columns</text><text x="42" y="144">Persistent navigation</text><text x="42" y="172">Inline actions</text><text x="42" y="240">Reflow, never crop</text><text x="42" y="268">Target ≥44×44px</text>
<text x="358" y="116">One primary column</text><text x="358" y="144">Condensed navigation</text><text x="358" y="172">Grouped actions</text><text x="358" y="240">No horizontal scroll</text><text x="358" y="268">Preserve labels</text>
<text x="674" y="116">Single column</text><text x="674" y="144">Collapsed navigation</text><text x="674" y="172">Full-width actions</text><text x="674" y="240">Priority order retained</text><text x="674" y="268">Context retained</text>
</g></g>
</svg>