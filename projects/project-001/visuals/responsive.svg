<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="Generic responsive layout model">
<title>Generic responsive layout model</title>
<g fill="#f7f8fa" stroke="#9aa6b2">
<rect x="24" y="32" width="240" height="360" rx="10"/>
<rect x="288" y="32" width="384" height="360" rx="10"/>
<rect x="696" y="32" width="240" height="360" rx="10"/>
</g>
<g fill="#dde3ea">
<rect x="48" y="72" width="192" height="34" rx="5"/><rect x="48" y="128" width="192" height="120" rx="5"/><rect x="48" y="270" width="192" height="80" rx="5"/>
<rect x="312" y="72" width="336" height="34" rx="5"/><rect x="312" y="128" width="336" height="120" rx="5"/><rect x="312" y="270" width="160" height="80" rx="5"/><rect x="488" y="270" width="160" height="80" rx="5"/>
<rect x="720" y="72" width="192" height="34" rx="5"/><rect x="720" y="128" width="120" height="222" rx="5"/><rect x="856" y="128" width="56" height="222" rx="5"/>
</g>
<g font-family="sans-serif" font-size="14" fill="#263238">
<text x="48" y="56">Compact</text><text x="312" y="56">Medium</text><text x="720" y="56">Wide</text>
<text x="48" y="378">Stacked regions</text><text x="312" y="378">Split utility areas</text><text x="720" y="378">Persistent context rail</text>
