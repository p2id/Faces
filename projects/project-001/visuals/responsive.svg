<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Responsive layout model">
<rect width="960" height="360" fill="#fff"/>
<g fill="none" stroke="#26364a" stroke-width="2">
<rect x="24" y="40" width="280" height="240"/><rect x="340" y="40" width="280" height="240"/><rect x="656" y="40" width="280" height="240"/>
</g>
<g fill="#eef1f5">
<rect x="40" y="72" width="248" height="36"/><rect x="40" y="124" width="248" height="100"/>
<rect x="356" y="72" width="248" height="36"/><rect x="356" y="124" width="248" height="42"/><rect x="356" y="182" width="248" height="42"/>
<rect x="672" y="72" width="248" height="36"/><rect x="672" y="124" width="248" height="100"/>
</g>
<g font-family="sans-serif" font-size="16" fill="#26364a"><text x="112" y="310">Compact</text><text x="430" y="310">Medium</text><text x="750" y="310">Wide</text></g>
</svg>
Rationale: Three layout classes communicate stacking, grouping, bounded width, and whitespace behavior.
Quality gates: validate at 320px, 768px, and 1440px; test 200% zoom, reflow, overflow, keyboard access, focus, and 44px controls.
Rules: compact layouts stack regions and retain primary actions; medium layouts preserve grouped panels; wide layouts use bounded content.