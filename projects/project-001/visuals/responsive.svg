Rationale: Content reflows before shrinking and preserves primary actions without device-specific assumptions.
Rules: compact uses one column; medium may use two regions; wide uses bounded content and an optional secondary region; targets are at least 40px; primary content does not scroll horizontally.
Quality gates: test 320px, 768px, 1280px, 200% zoom, focus order, overflow, and reduced motion.
Path intent: repository/design/2026-11-25/project-001/responsive.svg.
Publishing rule: include breakpoint evidence and document exceptions.