Rationale: Layout behavior is defined by available space rather than device labels.
Quality gates: no horizontal overflow; primary content precedes secondary content; controls remain reachable at every width.
Repository intent: /projects/project-001/sections/g/responsive.svg records layout intent; consuming specifications define exact measurements.