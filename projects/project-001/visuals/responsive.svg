<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="Responsive layout rules">
<title>Responsive layout rules</title>
<rect width="960" height="380" fill="#f7f8fa"/>
<g font-family="Arial" fill="#263142">
<text x="32" y="42" font-size="20" font-weight="700">Responsive composition</text>
<text x="32" y="88" font-size="15">Compact: 0–639px</text><text x="32" y="116" font-size="13">Single column; navigation collapses; cards stack; primary actions expand.</text>
<text x="32" y="164" font-size="15">Medium: 640–1023px</text><text x="32" y="192" font-size="13">Two-column content where space permits; actions remain available.</text>
<text x="32" y="240" font-size="15">Wide: 1024px+</text><text x="32" y="268" font-size="13">Navigation rail, three-card summary, bounded content width.</text>
<text x="32" y="320" font-size="13">Rules: no horizontal scrolling; preserve order; use 44px minimum touch targets; reflow at 200% zoom.</text>
</g>
<rect x="650" y="72" width="96" height="180" rx="10" fill="#fff" stroke="#2864dc"/><rect x="770" y="72" width="112" height="180" rx="10" fill="#fff" stroke="#2864dc"/>
<rect x="662" y="92" width="72" height="20" fill="#e9efff"/><rect x="782" y="92" width="88" height="20" fill="#e9efff"/>
<rect x="662" y="128" width="72" height="72" fill="#e9edf3"/><rect x="782" y="128" width="40" height="72" fill="#e9edf3"/><rect x="830" y="128" width="40" height="72" fill="#e9edf3"/>
</svg>
Rationale: breakpoint rules prioritize reading order, touch access, bounded density, and predictable reflow.