<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Interface state matrix">
<rect width="900" height="420" fill="#fff"/>
<g fill="#f2f4f7" stroke="#98a2b3">
<rect x="24" y="24" width="852" height="52"/><rect x="24" y="76" width="852" height="64"/>
<rect x="24" y="140" width="852" height="64"/><rect x="24" y="204" width="852" height="64"/>
<rect x="24" y="268" width="852" height="64"/><rect x="24" y="332" width="852" height="64"/>
</g>
<g font-family="system-ui,sans-serif" font-size="16" fill="#344054">
<text x="40" y="57">Region</text><text x="250" y="57">Default</text><text x="420" y="57">Loading</text><text x="590" y="57">Empty / Error</text>
<text x="40" y="114">Frame</text><text x="250" y="114">Content visible</text><text x="420" y="114">Reserved structure</text><text x="590" y="114">Recovery notice</text>
<text x="40" y="178">Content</text><text x="250" y="178">Structured items</text><text x="420" y="178">Placeholder rows</text><text x="590" y="178">Guidance and retry</text>
<text x="40" y="242">Control</text><text x="250" y="242">Enabled</text><text x="420" y="242">Pending or disabled</text><text x="590" y="242">Validation message</text>
<text x="40" y="306">Navigation</text><text x="250" y="306">Current location</text><text x="420" y="306">Stable location</text><text x="590" y="306">Fallback location</text>
<text x="40" y="370">Feedback</text><text x="250" y="370">Neutral confirmation</text><text x="420" y="370">Progress indication</text><text x="590" y="370">Actionable resolution</text>
</g>
</svg>
Rationale: A compact matrix makes state coverage reviewable without coupling the interface to implementation details.
Quality gates: default, loading, empty, error, disabled, focus, and reduced-motion behavior are defined for major regions; recovery preserves context.