<text x="40" y="198">Enabled actions</text><text x="222" y="198">Limited actions</text><text x="404" y="198">Primary action</text><text x="586" y="198">Retry or edit</text><text x="768" y="198">Continue or review</text>
<text x="40" y="246">Accessible labels</text><text x="222" y="246">Reduced motion</text><text x="404" y="246">Clear absence</text><text x="586" y="246">Neutral language</text><text x="768" y="246">Clear outcome</text>
</g>
