<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Interface state matrix">
<rect width="900" height="400" fill="#fff"/>
<g font-family="sans-serif" font-size="16" fill="#182230">
<text x="30" y="36" font-weight="700">State</text><text x="250" y="36" font-weight="700">Presentation</text><text x="650" y="36" font-weight="700">Available response</text>
<text x="30" y="82">Idle</text><text x="250" y="82">Stable content</text><text x="650" y="82">Primary action</text>
<text x="30" y="142">Loading</text><text x="250" y="142">Reserved space</text><text x="650" y="142">No layout shift</text>
<text x="30" y="202">Empty</text><text x="250" y="202">Guidance and next step</text><text x="650" y="202">Clear alternative</text>
<text x="30" y="262">Error</text><text x="250" y="262">Concise recovery message</text><text x="650" y="262">Retry or exit</text>
<text x="30" y="322">Success</text><text x="250" y="322">Confirmation signal</text><text x="650" y="322">Continue or review</text>
<text x="30" y="382">Disabled</text><text x="250" y="382">Muted with reason</text><text x="650" y="382">No false affordance</text>
</g>
<g stroke="#d9dee7"><path d="M20 50H880M20 110H880M20 170H880M20 230H880M20 290H880M20 350H880M20 395H880"/><path d="M220 20V395M620 20V395"/></g>
</svg>
Rationale: Covers primary, transitional, absent, failed, completed, and unavailable states without relying on hidden context.