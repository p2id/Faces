<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Interface state matrix">
<rect width="960" height="420" fill="#fff"/>
<g font-family="sans-serif" font-size="16" fill="#26364a">
<text x="32" y="34">State</text><text x="220" y="34">View</text><text x="420" y="34">Action</text><text x="650" y="34">Feedback</text>
<text x="32" y="88">Initial</text><text x="220" y="88">Empty or guided</text><text x="420" y="88">Start</text><text x="650" y="88">Next-step guidance</text>
<text x="32" y="142">Loading</text><text x="220" y="142">Stable skeleton</text><text x="420" y="142">Deferred controls</text><text x="650" y="142">Progress indication</text>
<text x="32" y="196">Ready</text><text x="220" y="196">Complete content</text><text x="420" y="196">Primary and secondary</text><text x="650" y="196">Status confirmation</text>
<text x="32" y="250">Validation</text><text x="220" y="250">Input retained</text><text x="420" y="250">Correct or retry</text><text x="650" y="250">Inline message</text>
<text x="32" y="304">Failure</text><text x="220" y="304">Recoverable notice</text><text x="420" y="304">Retry or alternate</text><text x="650" y="304">Cause and recovery</text>
<text x="32" y="358">Complete</text><text x="220" y="358">Outcome summary</text><text x="420" y="358">Continue or close</text><text x="650" y="358">Persistent result</text>
</g>
<path d="M24 48H936M24 102H936M24 156H936M24 210H936M24 264H936M24 318H936M24 372H936" stroke="#d9dfe7"/>
</svg>
Rationale: Explicit states define predictable content, action, feedback, and recovery behavior.
Quality gates: every action covers pending, success, validation, and failure; state changes are perceivable; focus is retained or intentionally moved; no high-impact transition is implicit.