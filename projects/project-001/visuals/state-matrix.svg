<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Interface state matrix">
<title>Interface state matrix</title>
<rect width="960" height="420" fill="#fff"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#17202a">
<text x="32" y="38" font-weight="bold">Component state matrix</text>
<text x="32" y="82">Component</text><text x="240" y="82">Default</text><text x="420" y="82">Focus</text><text x="600" y="82">Error</text><text x="780" y="82">Disabled</text>
<text x="32" y="132">Input</text><text x="240" y="132">Empty hint</text><text x="420" y="132">Visible outline</text><text x="600" y="132">Message + outline</text><text x="780" y="132">Muted fill</text>
<text x="32" y="182">Action</text><text x="240" y="182">Primary fill</text><text x="420" y="182">Contrast ring</text><text x="600" y="182">Not applicable</text><text x="780" y="182">Muted fill</text>
<text x="32" y="232">Panel</text><text x="240" y="232">Content</text><text x="420" y="232">Not applicable</text><text x="600" y="232">Inline alert</text><text x="780" y="232">Reduced contrast</text>
<text x="32" y="282">Loading</text><text x="240" y="282">Placeholder</text><text x="420" y="282">Not applicable</text><text x="600" y="282">Retry option</text><text x="780" y="282">Not applicable</text>
<text x="32" y="348">Gate: every interactive state has visible focus, readable feedback, keyboard order, and non-color status.</text>
</g>
<g stroke="#d7dce3" fill="none"><path d="M24 56h912M24 100h912M24 148h912M24 198h912M24 248h912M24 300h912"/></g>
</svg>