Rationale: the matrix makes state completeness reviewable and prevents default-state coverage from masking operational gaps.
Quality gates: every surface defines initial, loading, empty, error, and completion behavior; recovery is actionable; status does not depend on color alone.
Repository path intent: /projects/project-001/sections/e/state-matrix.svg
Publishing rule: update on every surface, state, or transition change; do not publish undefined terminal states.