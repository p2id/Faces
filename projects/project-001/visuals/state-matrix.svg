<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Component state matrix">
<title>State matrix</title>
<rect width="960" height="440" fill="#F7F8FA"/>
<rect x="24" y="24" width="912" height="392" rx="8" fill="#FFF" stroke="#D8DDE6"/>
<g font-family="Arial,sans-serif" font-size="14" fill="#172033">
<rect x="24" y="24" width="912" height="48" fill="#EEF1F5"/>
<text x="48" y="54">Component</text><text x="250" y="54">Default</text><text x="410" y="54">Focus</text><text x="570" y="54">Disabled</text><text x="730" y="54">Empty / Error</text>
