<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Generic interface state matrix">
<title>Interface state matrix</title>
<g font-family="sans-serif" font-size="16" fill="#20242a">
<text x="32" y="36" font-weight="bold">State</text><text x="220" y="36" font-weight="bold">Visible response</text><text x="650" y="36" font-weight="bold">Next action</text>
<text x="32" y="86">Initial</text><text x="220" y="86">Structure and primary action</text><text x="650" y="86">Select or continue</text>
<text x="32" y="136">Loading</text><text x="220" y="136">Stable shell and progress cue</text><text x="650" y="136">Wait or cancel</text>
<text x="32" y="186">Empty</text><text x="220" y="186">Explanation and useful entry point</text><text x="650" y="186">Create or revise</text>
<text x="32" y="236">Invalid</text><text x="220" y="236">Inline guidance near source</text><text x="650" y="236">Correct input</text>
<text x="32" y="286">Complete</text><text x="220" y="286">Confirmation and retained context</text><text x="650" y="286">Review or close</text>
<text x="32" y="336">Unavailable</text><text x="220" y="336">Reason, scope, and safe alternative</text><text x="650" y="336">Retry or return</text>
</g>
<g stroke="#c9ced6"><path d="M20 52H880M20 102H880M20 152H880M20 202H880M20 252H880M20 302H880M20 352H880"/></g>
</svg>
Rationale: Explicit states cover normal, exceptional, and recovery conditions.
Quality gates: Each primary action has initial, loading, empty, invalid, complete, and unavailable behavior.
