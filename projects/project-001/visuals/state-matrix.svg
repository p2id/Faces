<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Generic interface state matrix">
<title>Generic interface state matrix</title>
<rect width="960" height="360" fill="#fff"/>
<g fill="none" stroke="#c9ced6"><rect x="24" y="24" width="912" height="288" rx="6"/><path d="M24 72h912M24 120h912M24 168h912M24 216h912M24 264h912M206 24v288M388 24v288M570 24v288M752 24v288"/></g>
<g font-family="Arial,sans-serif" font-size="14" fill="#273142">
<text x="40" y="54" font-weight="700">Ready</text><text x="222" y="54" font-weight="700">Loading</text><text x="404" y="54" font-weight="700">Empty</text><text x="586" y="54" font-weight="700">Error</text><text x="768" y="54" font-weight="700">Success</text>
</g>
<g font-family="Arial,sans-serif" font-size="12" fill="#596579">
<text x="40" y="102">Content + controls</text><text x="222" y="102">Progress + stable layout</text><text x="404" y="102">Explanation + action</text><text x="586" y="102">Cause + recovery</text><text x="768" y="102">Confirmation + next step</text>
