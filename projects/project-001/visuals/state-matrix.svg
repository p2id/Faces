<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="Interface state matrix">
<title>Interface State Matrix</title>
<rect width="960" height="390" fill="#f7f8fa"/>
<rect x="32" y="24" width="896" height="342" rx="8" fill="#fff" stroke="#c8ced8"/>
<rect x="32" y="24" width="896" height="48" rx="8" fill="#eef1f5"/>
<g font-family="Arial,sans-serif" font-size="15" fill="#293241">
<text x="52" y="55">Pattern</text><text x="230" y="55">Default</text><text x="400" y="55">Focus</text><text x="570" y="55">Disabled</text><text x="750" y="55">Feedback</text>
<text x="52" y="108">Action</text><text x="230" y="108">Ready</text><text x="400" y="108">Visible ring</text><text x="570" y="108">Muted</text><text x="750" y="108">Success/error</text>
<text x="52" y="162">Input</text><text x="230" y="162">Empty/value</text><text x="400" y="162">Visible ring</text><text x="570" y="162">Read-only</text><text x="750" y="162">Hint/error</text>
<text x="52" y="216">Navigation</text><text x="230" y="216">Available</text><text x="400" y="216">Visible ring</text><text x="570" y="216">Unavailable</text><text x="750" y="216">Current</text>
<text x="52" y="270">Panel</text><text x="230" y="270">Loaded</text><text x="400" y="270">Contained</text><text x="570" y="270">Unavailable</text><text x="750" y="270">Loading/empty</text>
<text x="52" y="324">Message</text><text x="230" y="324">Neutral</text><text x="400" y="324">N/A</text><text x="570" y="324">Muted</text><text x="750" y="324">Info/warning</text>
</g></svg>