<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="Interface state matrix">
<title>Interface state matrix</title>
<rect width="920" height="420" fill="#fff"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#172033"><text x="32" y="36" font-weight="700">Surface</text><text x="250" y="36" font-weight="700">Ready</text><text x="410" y="36" font-weight="700">Loading</text><text x="570" y="36" font-weight="700">Empty</text><text x="730" y="36" font-weight="700">Error</text></g>
<g stroke="#cbd3df" fill="none"><path d="M24 52H896M24 124H896M24 196H896M24 268H896M24 340H896M24 52V340M232 52V340M392 52V340M552 52V340M712 52V340M896 52V340"/></g>
<g font-family="Arial,sans-serif" font-size="15" fill="#26344a">
<text x="40" y="96">Workspace</text><text x="40" y="168">Search</text><text x="40" y="240">Form</text><text x="40" y="312">Notice</text>
<text x="250" y="96">Content and actions</text><text x="410" y="96">Skeleton blocks</text><text x="570" y="96">Guidance and action</text><text x="730" y="96">Recovery and retry</text>
<text x="250" y="168">Results and count</text><text x="410" y="168">Progressive rows</text><text x="570" y="168">Query guidance</text><text x="730" y="168">Clear cause</text>
<text x="250" y="240">Values and submit</text><text x="410" y="240">Disabled submit</text><text x="570" y="240">Optional prompt</text><text x="730" y="240">Field recovery</text>
