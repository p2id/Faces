<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" aria-label="Interface state matrix">
<title>Interface state matrix</title>
<g fill="#F8FAFC" stroke="#334155" stroke-width="2"><rect x="20" y="20" width="960" height="390" rx="8"/><path d="M20 76h960M220 20v390M410 20v390M600 20v390M790 20v390"/></g>
<g fill="#334155" font-family="system-ui,sans-serif" font-size="16">
<text x="40" y="55">State</text><text x="240" y="55">Entry</text><text x="430" y="55">Visible response</text><text x="620" y="55">Allowed action</text><text x="810" y="55">Exit</text>
<text x="40" y="112">Initial</text><text x="240" y="112">Surface opens</text><text x="430" y="112">Structure and guidance</text><text x="620" y="112">Navigate or start</text><text x="810" y="112">Selection</text>
<text x="40" y="172">Loading</text><text x="240" y="172">Content requested</text><text x="430" y="172">Stable placeholders</text><text x="620" y="172">Wait or cancel</text><text x="810" y="172">Content ready</text>
<text x="40" y="232">Empty</text><text x="240" y="232">No content</text><text x="430" y="232">Cause and next step</text><text x="620" y="232">Create or refine</text><text x="810" y="232">Content added</text>
<text x="40" y="292">Error</text><text x="240" y="292">Unavailable action</text><text x="430" y="292">Recovery message</text><text x="620" y="292">Retry or return</text><text x="810" y="292">Recovery</text>
<text x="40" y="352">Complete</text><text x="240" y="352">Action succeeds</text><text x="430" y="352">Confirmation and result</text><text x="620" y="352">Continue or review</text><text x="810" y="352">Next context</text>
</g></svg>