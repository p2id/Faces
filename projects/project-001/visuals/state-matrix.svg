<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Interface state matrix">
<title>Interface state matrix</title>
<rect width="900" height="430" fill="#fff"/>
<g font-family="Arial" font-size="16" fill="#101828">
<text x="32" y="36">Surface</text><text x="220" y="36">Default</text><text x="380" y="36">Loading</text><text x="540" y="36">Empty</text><text x="700" y="36">Error</text>
</g>
<g fill="#f9fafb" stroke="#d0d5dd">
<rect x="24" y="56" width="852" height="62" rx="4"/>
<rect x="24" y="124" width="852" height="62" rx="4"/>
<rect x="24" y="192" width="852" height="62" rx="4"/>
<rect x="24" y="260" width="852" height="62" rx="4"/>
<rect x="24" y="328" width="852" height="62" rx="4"/>
</g>
<g font-family="Arial" font-size="14" fill="#344054">
<text x="40" y="92">Overview</text><text x="40" y="160">Collection</text><text x="40" y="228">Detail</text><text x="40" y="296">Form</text><text x="40" y="364">Notification</text>
<text x="220" y="92">Content + action</text><text x="380" y="92">Placeholder</text><text x="540" y="92">Guidance + action</text><text x="700" y="92">Recovery</text>
<text x="220" y="160">Items + controls</text><text x="380" y="160">Skeleton</text><text x="540" y="160">Create prompt</text><text x="700" y="160">Retry guidance</text>
<text x="220" y="228">Attributes</text><text x="380" y="228">Progressive reveal</text><text x="540" y="228">Unavailable notice</text><text x="700" y="228">Fallback</text>
<text x="220" y="296">Fields + validation</text><text x="380" y="296">Disabled submit</text><text x="540" y="296">Not applicable</text><text x="700" y="296">Inline correction</text>
<text x="220" y="364">Contextual status</text><text x="380" y="364">Pending</text><text x="540" y="364">Not applicable</text><text x="700" y="364">Actionable alert</text>
</g>
</svg>
Rationale: Explicit non-default states cover continuity, feedback, recovery, and content absence.
Quality gates: every major surface has default, loading, empty, and error treatment; recovery is actionable; status never depends on color alone.