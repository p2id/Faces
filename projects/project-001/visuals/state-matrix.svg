<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="Component state matrix">
<title>Component state matrix</title>
<rect width="960" height="390" fill="#fff"/>
<g font-family="Arial,sans-serif" font-size="14" fill="#17202a">
<rect x="24" y="24" width="912" height="48" fill="#e9edf2"/>
<g stroke="#d7dce3" fill="none"><rect x="24" y="72" width="912" height="264"/><path d="M200 24v312M360 24v312M520 24v312M680 24v312M24 120h912M24 168h912M24 216h912M24 264h912M24 312h912"/></g>
<text x="44" y="54">Component</text><text x="220" y="54">Default</text><text x="380" y="54">Focus</text><text x="540" y="54">Disabled</text><text x="700" y="54">Error / Empty</text>
<text x="44" y="102">Button</text><text x="220" y="102">Ready</text><text x="380" y="102">Visible ring</text><text x="540" y="102">Muted</text><text x="700" y="102">Inline message</text>
<text x="44" y="150">Field</text><text x="220" y="150">Blank / value</text><text x="380" y="150">2px outline</text><text x="540" y="150">Read-only</text><text x="700" y="150">Required hint</text>
<text x="44" y="198">Card</text><text x="220" y="198">Neutral</text><text x="380" y="198">Raised</text><text x="540" y="198">Unavailable</text><text x="700" y="198">No content</text>
<text x="44" y="246">Navigation</text><text x="220" y="246">Inactive</text><text x="380" y="246">Keyboard focus</text><text x="540" y="246">Unavailable</text><text x="700" y="246">Current location</text>
<text x="44" y="294">Dialog</text><text x="220" y="294">Closed</text><text x="380" y="294">Open focus</text><text x="540" y="294">Blocked</text><text x="700" y="294">Recovery prompt</text>
</g>
<text x="24" y="370" font-family="Arial,sans-serif" font-size="12" fill="#536170">Coverage: focus, unavailable, validation, empty, success, and recovery states.</text>
</svg>