<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Interface state matrix">
<title>Interface state matrix</title>
<rect width="960" height="430" fill="#f7f8fa"/>
<g font-family="Arial" font-size="16" fill="#263142">
<text x="32" y="40" font-weight="700">Surface</text><text x="220" y="40" font-weight="700">Default</text><text x="390" y="40" font-weight="700">Loading</text><text x="560" y="40" font-weight="700">Empty</text><text x="730" y="40" font-weight="700">Error / Recovery</text>
<text x="32" y="92">Overview</text><text x="220" y="92">Content shown</text><text x="390" y="92">Reserved blocks</text><text x="560" y="92">Guidance</text><text x="730" y="92">Retry + detail</text>
<text x="32" y="152">Collection</text><text x="220" y="152">Items + filters</text><text x="390" y="152">Row placeholders</text><text x="560" y="152">Create action</text><text x="730" y="152">Retry + preserve filters</text>
<text x="32" y="212">Form</text><text x="220" y="212">Editable fields</text><text x="390" y="212">Disabled submit</text><text x="560" y="212">Optional fields</text><text x="730" y="212">Inline correction</text>
<text x="32" y="272">Dialog</text><text x="220" y="272">Context + actions</text><text x="390" y="272">Progress indicator</text><text x="560" y="272">Not applicable</text><text x="730" y="272">Cancel + retry</text>
<text x="32" y="332">Notification</text><text x="220" y="332">Transient feedback</text><text x="390" y="332">Queued feedback</text><text x="560" y="332">Hidden</text><text x="730" y="332">Persistent recovery</text>
</g>
<g stroke="#c9ced6" fill="none"><path d="M24 56H936M24 106H936M24 166H936M24 226H936M24 286H936M24 346H936M24 396H936"/><path d="M24 24V396M204 24V396M374 24V396M544 24V396M714 24V396M936 24V396"/></g>
</svg>
Coverage rationale: default, progress, empty, validation, failure, recovery, and success conditions are represented across core surfaces.